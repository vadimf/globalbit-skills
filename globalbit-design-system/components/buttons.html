<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Globalbit — Buttons</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style> body { font-family: "Inter", system-ui, sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-900 p-8">
  <div class="flex flex-wrap items-center gap-4">
    <!-- Primary -->
    <button class="rounded-lg bg-gray-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-gray-800">
      Primary action
    </button>
    <!-- Secondary (active toggle) -->
    <button class="rounded-lg bg-gray-900 px-3 py-1.5 text-sm font-medium text-white">
      Active
    </button>
    <!-- Secondary (inactive) -->
    <button class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm font-medium text-gray-600 transition-colors hover:bg-gray-50">
      Inactive
    </button>
  </div>
</body>
</html>
