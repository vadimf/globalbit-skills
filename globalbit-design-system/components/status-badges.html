<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Globalbit — Status Badges</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style> body { font-family: "Inter", system-ui, sans-serif; } </style>
</head>
<body class="bg-gray-50 p-8">
  <!-- Deal stages: always -100 bg / -700 text -->
  <div class="flex flex-wrap gap-2">
    <span class="rounded-md bg-blue-100 px-2.5 py-0.5 text-xs font-medium text-blue-700">New</span>
    <span class="rounded-md bg-sky-100 px-2.5 py-0.5 text-xs font-medium text-sky-700">Keep in touch</span>
    <span class="rounded-md bg-purple-100 px-2.5 py-0.5 text-xs font-medium text-purple-700">Contacted</span>
    <span class="rounded-md bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-700">Qualified</span>
    <span class="rounded-md bg-orange-100 px-2.5 py-0.5 text-xs font-medium text-orange-700">Proposal Sent</span>
    <span class="rounded-md bg-pink-100 px-2.5 py-0.5 text-xs font-medium text-pink-700">Negotiation</span>
    <span class="rounded-md bg-violet-100 px-2.5 py-0.5 text-xs font-medium text-violet-700">Commit</span>
    <span class="rounded-md bg-emerald-100 px-2.5 py-0.5 text-xs font-medium text-emerald-700">Won</span>
    <span class="rounded-md bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-500">Lost</span>
    <span class="rounded-md bg-slate-100 px-2.5 py-0.5 text-xs font-medium text-slate-500">Archived</span>
  </div>
</body>
</html>
